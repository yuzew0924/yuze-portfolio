<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ current_category }} — Yuze's Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/font.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navigator.css') }}?v=2">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
</head>
<body>
    <div class="loading">
        <div class="loader"></div>
    </div>
    <div class="container">
        <div class="navigator">
            <div class="title">
                <a href="{{ url_for('profile') }}" aria-label="Back to Ethan's home page">Ethan's Personal Website</a>
            </div>
        </div>
        <header class="gallery-header">
            <a class="back-home" href="{{ url_for('profile') }}"><span aria-hidden="true">&larr;</span> Back to home</a>
            <div class="gallery-title-row">
                <div>
                    <p class="gallery-kicker">Gallery collection</p>
                    <h1>{{ current_category }}</h1>
                </div>
                <p>{{ img_list|length }} photos</p>
            </div>
            <nav class="collection-switcher" aria-label="Gallery collections">
                <a href="{{ url_for('gallery_all') }}" {% if current_category == 'All Photos' %}class="active" aria-current="page"{% endif %}>All Photos</a>
                {% for category in categories %}
                <a href="{{ url_for('gallery', category=category) }}" {% if category == current_category %}class="active" aria-current="page"{% endif %}>{{ category }}</a>
                {% endfor %}
            </nav>
        </header>
        <div class="waterfall">
            {% for img in img_list%}
            <div class="item" data-category="{{ img.category }}">
                <img src="{{ url_for('static', filename='images/' ~ img.path) }}" alt="{{ img.filename }}" loading="lazy" decoding="async">
                <div class="view">
                    <div class="category-label">{{ img.category }}</div>
                    <div class="date">{{img.date}}</div>
                </div>
                <!-- <div class="desc">1 convallis timestamp</div> -->
            </div>	 
            {% endfor %}
          </div>
          <p class="empty-gallery">No photos in this collection yet.</p>
          <div class="gallery-footer-space" aria-hidden="true"></div>
    </div>
    <script src="{{ url_for('static', filename='js/loading.js') }}?v=2"></script>
</body>
</html>
