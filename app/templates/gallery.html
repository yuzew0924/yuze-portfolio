<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuze's Image Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/font.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navigator.css') }}?v=2">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
</head>
<body>
    <div class="loading">
        <div class="loader"></div>
    </div>
    <div class="container">
        <div class="navigator">
            <div class="title">
                <p>Ethan (Yuze) 's Gallery</p>
            </div>
            <div class="buttons">
                <!-- <i class="fa-solid fa-magnifying-glass button"></i> -->
                <div class="category-menu">
                    <button class="button category-toggle" type="button" style="scale: 1.3; font-weight: bold;">Gallery</button>
                    <div class="category-dropdown">
                        <button class="category-option active" type="button" data-category="all">All Photos</button>
                        {% for category in categories %}
                        <button class="category-option" type="button" data-category="{{ category }}">{{ category }}</button>
                        {% endfor %}
                    </div>
                </div>
                <p class="button" id="to_profile">Profile</p>
            </div>
            <!-- <div class="phone_buttons">
                <i class="fa-solid fa-bars"></i>
            </div> -->
        </div>
        <div class="waterfall">
            {% for img in img_list%}
            <div class="item" data-category="{{ img.category }}">
                <img src="{{ url_for('static', filename='images/' ~ img.path) }}" alt="{{ img.filename }}" loading="lazy" decoding="async">
                <div class="view">
                    <div class="category-label">{{ img.category }}</div>
                    <div class="date">{{img.date}}</div>
                </div>
                <!-- <div class="desc">1 convallis timestamp</div> -->
            </div>	 
            {% endfor %}
          </div>
          <p class="empty-gallery">No photos in this type yet.</p>
    </div>
    <script src="{{ url_for('static', filename='js/to_profile.js') }}"></script>
    <script src="{{ url_for('static', filename='js/gallery_filter.js') }}?v=7"></script>
    <script src="{{ url_for('static', filename='js/loading.js') }}?v=2"></script>
</body>
</html>
